name: release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  cli:
    timeout-minutes: 30
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: rust
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.zig
        with:
          use-cache: false
      - run: rustup target add ${{ matrix.target }}

      - name: Build
        run: |
          if [ -n "${{ matrix.zig }}" ]; then
            cargo install cargo-zigbuild --locked
            cargo zigbuild --release -p tidy_cli --target ${{ matrix.target }}
          else
            cargo build --release -p tidy_cli --target ${{ matrix.target }}
          fi

      # The archive holds the executable alone, at its root, so that a
      # consumer reading `bin` from the packslip finds it where it says.
      - name: Package
        run: |
          mkdir -p dist
          out="target/${{ matrix.target }}/release"
          case "${{ matrix.target }}" in
          *windows*)
            archive="dist/tidy-${{ matrix.target }}.zip"
            7z a "$archive" "./$out/tidy.exe" > /dev/null
            ;;
          *)
            archive="dist/tidy-${{ matrix.target }}.tar.gz"
            tar -czf "$archive" -C "$out" tidy
            ;;
          esac
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" | sed -E 's|^([0-9a-f]+) [ *].*/|\1  |' > "$archive.sha256"
          else
            shasum -a 256 "$archive" | sed -E 's|^([0-9a-f]+) [ *].*/|\1  |' > "$archive.sha256"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    timeout-minutes: 15
    name: release
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

      # Signs the archives and their digests with this workflow's identity, so
      # an installer can verify what it downloads instead of trusting a name.
      - uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        with:
          artifacts: dist/*.tar.gz dist/*.zip
          bin: tidy
          tag: ${{ inputs.tag || github.ref_name }}

  # tidy.lukeed.com/download serves these out of R2, so the installer never
  # leaves the site, and an archive can be counted.
  r2:
    timeout-minutes: 10
    name: r2
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      # The S3 API, unlike the REST API, honors the token's bucket scope:
      # key = token id, secret = sha256(token).
      - name: Upload to R2
        shell: bash
        env:
          R2: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com/tidy-releases
          R2_KEY: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          secret=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          s3() { curl -sS --retry 3 --aws-sigv4 'aws:amz:auto:s3' --user "$R2_KEY:$secret" "$@"; }
          put() {
            sum=$(sha256sum "$1" | cut -d' ' -f1)
            s3 --fail -o /dev/null -H "x-amz-content-sha256: $sum" -T "$1" "$R2/$2"
          }

          for file in dist/*; do
            put "$file" "$TAG/${file##*/}"
          done

          code=$(s3 -o current -w '%{http_code}' -H 'x-amz-content-sha256: UNSIGNED-PAYLOAD' "$R2/latest")
          case $code in
          200) current=$(cat current) ;;
          404) current="" ;;
          *) echo "::error::could not read latest from R2: HTTP $code"; exit 1 ;;
          esac

          # A run for an older tag never moves latest back.
          newest=$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "latest stays at $current, which is newer than $TAG"
            exit 0
          fi
          printf '%s' "$TAG" > latest
          put latest latest

  build:
    timeout-minutes: 30
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              flags: --use-napi-cross,
              test: true,
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              flags: --use-napi-cross,
            }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: -x }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: -x }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
        working-directory: crates/tidy_napi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: contains(matrix.target, 'musl')
        with:
          use-cache: false
      - run: rustup target add ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - run: bunx napi build --platform --release --esm --target ${{ matrix.target }} ${{ matrix.flags }}
      - run: bun test
        if: matrix.test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-${{ matrix.target }}
          path: crates/tidy_napi/tidyrs.*.node
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: loader
          path: |
            crates/tidy_napi/index.js
            crates/tidy_napi/index.d.ts
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: crates/tidy_napi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: addon-*
          path: crates/tidy_napi/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: loader
          path: crates/tidy_napi
      - run: bunx napi create-npm-dirs
      - run: bunx napi artifacts --output-dir artifacts
      # npm authenticates from the job's OIDC token, so no long-lived secret.
      # Each platform package has its own trusted publisher, as tidyrs does.
      - run: bunx napi pre-publish -t npm --no-gh-release
      - run: npm publish
