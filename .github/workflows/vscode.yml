name: vscode

on:
  push:
    tags: ["vscode@*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as vscode@0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: vscode

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Both stores can trust this workflow by OIDC, so no publishing token has to be stored.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: bun rust
          cache: false
      - run: bun install --frozen-lockfile

      - name: Check the tag matches the version
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "vscode@$version" ]; then
            echo "::error::$TAG does not match vscode@$version in package.json"
            exit 1
          fi

      - run: bun check
      - run: bun test.ts
      - run: bun run vsix --out tidy.vsix

      - run: bunx vsce publish --packagePath tidy.vsix --oidc --skip-duplicate
      # Open VSX uses the token while it is set, and trusted publishing once the secret is deleted.
      - run: bunx ovsx publish tidy.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
