[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lukeed/tidyrs"

[workspace.dependencies]
tidyrs = { path = "crates/tidyrs" }
bumpalo = "3.19"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = false
