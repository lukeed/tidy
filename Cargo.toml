[workspace]
resolver = "3"
members = [
  "crates/tidy",
  "crates/tidy_cli",
  "crates/tidy_napi",
  "crates/tidy_walk",
]
exclude = [
  "bench/css",
  "bench/dprint",
  "bench/parse",
  "bench/walk",
  "tests/oracle/dockerfile",
  "tests/oracle/meaning",
  "tests/oracle/toml",
  "tests/oracle/yaml",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/lukeed/tidy"

[workspace.dependencies]
tidy = { path = "crates/tidy" }
tidy_walk = { path = "crates/tidy_walk" }
bumpalo = "3.19"

[workspace.lints.rust]
unsafe_code = "deny"
# Builds the parsers that aren't public for bench/parse.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tidy_bench)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = false
