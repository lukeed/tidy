[package]
name = "tidy"
description = "A fast formatter for HTML, Vue, Handlebars, CSS, JSON, YAML, TOML, XML and Markdown, with Prettier's style by default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["html", "markdown", "formatter", "prettier", "vue"]
categories = ["text-processing", "development-tools"]

[dependencies]
bitflags = "2"
bumpalo = { workspace = true }
ec4rs = { version = "1.2.0", optional = true }
memchr = "2"
pulldown-cmark = { version = "=0.13.6", default-features = false }
rustc-hash = "2"
smallvec = { version = "1.16.4", features = ["union"] }
unicode-ident = "1"
unicode-width = "0.2"
serde_json = { version = "1", optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

[features]
# Reads tidy.json, tidy.jsonc, tidy.toml and .editorconfig files.
config = ["dep:serde_json", "dep:ec4rs"]
