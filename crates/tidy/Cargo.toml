[package]
name = "tidy"
description = "A fast markup formatter for HTML, Vue, Svelte, Astro, XML, and Handlebars, with Prettier's style by default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["html", "formatter", "prettier", "svelte", "vue"]
categories = ["text-processing", "development-tools"]

[dependencies]
bitflags = "2"
bumpalo = { workspace = true }
ec4rs = { version = "1.2.0", optional = true }
jsonc-parser = { version = "0.34.0", features = ["serde"], optional = true }
memchr = "2"
rustc-hash = "2"
serde_json = { version = "1", optional = true }
toml = { version = "1.1.8", optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

[features]
# Reads tidy.json, tidy.jsonc, tidy.toml and .editorconfig files.
config = ["dep:serde_json", "dep:jsonc-parser", "dep:toml", "dep:ec4rs"]
