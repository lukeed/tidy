[package]
name = "tidyrs"
description = "A fast markup formatter for HTML, Vue, Svelte, Astro, XML, and Handlebars, with Prettier's style by default"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["html", "formatter", "prettier", "svelte", "vue"]
categories = ["text-processing", "development-tools"]

[dependencies]
bitflags = "2"
bumpalo = { workspace = true }
memchr = "2"
rustc-hash = "2"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
