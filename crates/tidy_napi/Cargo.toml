[package]
name = "tidy_napi"
description = "Node bindings for tidy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
tidy = { workspace = true, features = ["config"] }
serde_json = "1"
napi = { version = "3.16.0", default-features = false, features = [
  "napi4",
  "serde-json",
] }
napi-derive = "3.7.0"

[build-dependencies]
napi-build = "2.6.0"

[lints]
workspace = true
